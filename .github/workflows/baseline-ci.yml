# KingdomGoods | Baseline application checks
name: Baseline CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read

    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}

    steps:
      - name: Checkout repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: identify changed files
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: main
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/baseline-ci.yml'
              - 'docker-compose.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/baseline-ci.yml'
              - 'docker-compose.yml'

  frontend:
    name: Frontend lint build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20.20.2'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: check code quality
        run: npm run lint

      - name: build frontend
        run: npm run build

  backend:
    name: Backend lint build
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Compile packages and run tests
        run: go test -mod=readonly -v ./...

      - name: Run static analysis
        run: go vet -mod=readonly ./...

  ci-results:
    name: CI results
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [changes, frontend, backend]     #  This job waits for all three jobs to reach a final state.
    timeout-minutes: 5

    steps:
      - name: Validate job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_REQUIRED: ${{ needs.changes.outputs.frontend }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection did not succeed."
            exit 1
          fi

          check_result() {
            local component="$1"
            local required="$2"
            local result="$3"

            case "$required:$result" in
              true:success|false:skipped)
                echo "$component: accepted ($result)"
                ;;
              *)
                echo "$component: unexpected result ($required / $result)"
                exit 1
                ;;
            esac
          }

          check_result "Frontend" "$FRONTEND_REQUIRED" "$FRONTEND_RESULT"
          check_result "Backend" "$BACKEND_REQUIRED" "$BACKEND_RESULT"
